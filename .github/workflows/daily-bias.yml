name: Daily Bias Pipeline

on:
  schedule:
    - cron: "15 23 * * *" # UTC 23:15 = 香港07:15，記錄今日模型預測
    # settle要留足夠buffer:實測GitHub cron延遲去到126-145分鐘(2026-08-03至05),
    # 排22:15 HKT都會俾佢推過香港午夜,daily_log個保險掣就會skip咗香港settle
    # (連續3日冇實測入賬)。排20:15 HKT留3小時45分buffer,而香港日高溫
    # 14-15時就見頂,20:15結算穩陣。
    - cron: "15 12 * * *" # UTC 12:15 = 香港20:15，記錄今日實測+重計bias
    # 市價快照:香港market通常當日下晝先開盤,07:15嗰班一定攞唔到價
    # (2026-08-22查:市價欄開咗10日,92行一格都冇記到)。排兩班係因為
    # 開盤時間唔固定,cron又會延遲——第一班攞到就唔會覆蓋。
    - cron: "0 5 * * *"  # UTC 05:00 = 香港13:00
    - cron: "0 7 * * *"  # UTC 07:00 = 香港15:00
    - cron: "0 8 * * *"  # UTC 08:00 = 香港16:00
    # ⚠️唔會排更夜嘅班:香港高溫14-15時見頂,再夜嘅市價已經接近結算價,
    # 攞返嚟同07:15出嘅模型比就係送分,個Brier對比會變成廢數。
    # 攞唔到就寧願冇,唔好攞個唔公道嘅價。
  workflow_dispatch:
    inputs:
      mode:
        description: "forecast / settle / market"
        required: true
        default: "forecast"

permissions:
  contents: write

concurrency:
  group: bias-data # 同backfill爭同一批檔,唔好撞
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 決定模式
        id: mode
        # ⚠️唔可以用「而家幾點」判斷:GitHub cron延遲過鐘(23:15排程00:07先行),
        # 曾令朝班全部錯行settle。github.event.schedule=觸發嗰條cron,延遲都唔變
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 23 * * *" ]; then
            echo "mode=forecast" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 12 * * *" ]; then
            echo "mode=settle" >> $GITHUB_OUTPUT
          else
            echo "mode=market" >> $GITHUB_OUTPUT
          fi

      - name: 執行
        run: node daily_log.js --mode=${{ steps.mode.outputs.mode }}

      - name: Commit記錄
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add forecast_log*.csv bias.json calibration_log.csv station_wedge.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: daily bias log (${{ steps.mode.outputs.mode }}) [skip ci]"
          git push
