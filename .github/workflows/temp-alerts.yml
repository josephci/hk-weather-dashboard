name: HK Temp Alerts (數據記錄 + 後備警報)

# ⚠️2026-09-13:個cron由 */5 改做每個鐘。唔係我哋想慢,係GitHub根本唔跑。
# 實測(26個鐘):
#   temp-alerts  */5     應該312次,實際 8 次 = 平均195分鐘一次
#   daily-bias   7個日cron  7/7 準時
#   scan-cities  4個日cron  4/4 準時
#   paper-trade  3個日cron  3/3 準時
#   nightly-check 1個日cron 1/1 準時
# 即係低頻cron GitHub全部照跑,淨係**高頻嗰個**俾佢靜靜哋跌咗97%。
# 而且每個run都係綠色success,睇fail數一世都查唔到。
#
# 寫住 */5 但實際3個鐘一次,係一句大話——會令人以為有即時警報。
# 所以改成每個鐘(GitHub真係會跑),同時講清楚:
#
#   ⚡ 即時警報唔係靠呢度,係靠 Cloudflare Worker 個 cron(worker.js)。
#      呢個workflow淨係做兩件事:記history.csv/rhrread_log.csv、做後備警報。
#
# 順帶:由8次/日變24次/日,history.csv密咗3倍,
# dashboard個趨勢圖同「未來1小時」個trendPts都會準啲。
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 唔俾兩個run重疊：history.csv係append-only,撞commit嘅話rebase都救唔到
# (同一行尾巴實conflict),排隊係唯一穩陣做法
concurrency:
  group: temp-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 數據commit全部去data branch，main唔再俾「chore: temp log」灌爆。
      # 第一次跑（data branch未存在）會由main HEAD起一個。
      - name: 攞data branch嘅最新state
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git worktree add -b data data-branch refs/remotes/origin/data
          else
            git worktree add -b data data-branch HEAD
          fi
          cp data-branch/alert_state.json data-branch/history.csv data-branch/rhrread_log.csv . 2>/dev/null || true

      - name: 執行溫度警報偵測
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node alert.js

      - name: 儲存 state + 歷史紀錄（push上data branch）
        run: |
          cp alert_state.json history.csv rhrread_log.csv data-branch/ 2>/dev/null || true
          cd data-branch
          git add alert_state.json history.csv rhrread_log.csv
          git diff --staged --quiet || git commit -m "chore: temp log $(date -u +%H:%M) [skip ci]"
          git push -u origin data
