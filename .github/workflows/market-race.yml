name: Market Race

# 測「Polymarket香港市場係咪快過天文台公佈」。
# 同時poll市場+4條HKO/METAR水喉,跑完分析邊個行先。
# 建議跑香港下晝高峰(12:00-17:00 HKT = 04:00-09:00 UTC)。
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "跑幾多個鐘(GitHub Actions單job上限6)"
        default: "4"
      commit_log:
        description: "跑完commit個log入repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-race
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 收集+分析
        run: node market_race.js --hours=${{ inputs.hours }}

      - name: Commit log
        if: ${{ inputs.commit_log }}
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add market_race_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: market race log [skip ci]"
          git pull --rebase origin main && git push
