name: Market Race

# 測「Polymarket香港市場係咪快過天文台公佈」。
# 同時poll市場+4條HKO/METAR水喉,跑完分析邊個行先。
# 建議跑香港下晝高峰(12:00-17:00 HKT = 04:00-09:00 UTC)。
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "跑幾多個鐘(GitHub Actions單job上限6)"
        default: "4"
      commit_log:
        description: "跑完commit個log入repo"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-race
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 收集+分析
        run: node market_race.js --hours=${{ inputs.hours }}

      - name: Commit log
        if: ${{ inputs.commit_log }}
        # ⚠️2026-09-20:本來係 `git pull --rebase origin main && git push`。
        # 跑咗5個鐘、收齊533行clob數據,最後喺呢一步死咗,全部資料冇晒:
        #   ! [rejected] claude/github-optimization-uk-tab-m5h4ld (fetch first)
        # 兩個錯:
        #  ① rebase去**main**,但checkout出嚟嘅係feature branch——夾硬撈埋main
        #     啲commit入嚟,根本唔係想要嘅嘢
        #  ② 個job跑緊嗰5個鐘,我喺條branch度push咗新commit,所以remote行先咗
        # 改成rebase返自己條branch,而且push唔到就再試一次(5個鐘唔可以就咁冇咗)。
        run: |
          BR="${GITHUB_REF_NAME}"
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add market_race_log.csv 2>/dev/null || true
          git diff --staged --quiet && { echo "冇新數據,唔使commit"; exit 0; }
          git commit -m "chore: market race log [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && exit 0
            echo "push唔到,第 $i 次重試…"; sleep $((i * 5))
          done
          echo "::error::3次都push唔到 $BR——啲數據仲喺runner度,睇返上面個分析先好收工"
          exit 1
